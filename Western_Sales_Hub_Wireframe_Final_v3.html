<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Western Sales Hub – Interactive wireframe</title>
    <style>
      :root {
        --g: #1f7a3e;
        --y: #fbe74d;
        --dk: #1b3a26;
        --bg: #f7faf2;
        --lg: #e8f4e3;
        --ly: #fff7c2;
        --bd: #d5e4cf;
        --b2: #9dbf96;
        --mu: #4b6354;
        --er: #b3261e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--dk);
        background: var(--bg);
        font-size: 15px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
      }
      h2 {
        font-size: 20px;
      }
      h3 {
        font-size: 16px;
      }
      a {
        color: inherit;
      }
      .mut {
        color: var(--mu);
        font-size: 13px;
      }
      .logo {
        height: 44px;
        width: auto;
        display: block;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 12px 32px;
        background: #fff;
        border-bottom: 4px solid var(--y);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .nav a {
        text-decoration: none;
        font-weight: 700;
      }
      .nav .in {
        flex: 1;
      }
      .banner {
        background: var(--ly);
        padding: 8px 32px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 32px;
      }
      .row {
        display: flex;
        gap: 20px;
      }
      .wrapr {
        flex-wrap: wrap;
      }
      .ac {
        align-items: center;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .g4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-top: 12px;
      }
      .g5 {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 24px;
      }
      .box {
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 18px;
        background: #fff;
        box-shadow: 0 1px 3px rgba(31, 122, 62, 0.1);
      }
      a.box {
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      a.box:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(31, 122, 62, 0.18);
      }
      .btn {
        display: inline-block;
        border: 1.5px solid var(--g);
        border-radius: 8px;
        padding: 10px 18px;
        background: #fff;
        color: var(--g);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        text-align: center;
      }
      .btn:hover {
        background: var(--lg);
      }
      .btn.p {
        background: var(--g);
        color: #fff;
      }
      .btn.p:hover {
        background: #176330;
      }
      .btn.y {
        background: var(--y);
        border-color: var(--y);
        color: var(--dk);
      }
      .btn.y:hover {
        background: #f3da2a;
      }
      .btn.sm {
        padding: 5px 12px;
        font-size: 13px;
      }
      .btn.dg {
        border-color: var(--er);
        color: var(--er);
      }
      .btn.dg:hover {
        background: #f7d4d1;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .lnk {
        color: var(--g);
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline;
        background: none;
        border: 0;
        font: inherit;
        padding: 0;
      }
      .in {
        border: 1.5px solid var(--b2);
        border-radius: 8px;
        padding: 11px 14px;
        background: #fff;
        color: var(--dk);
        font: inherit;
        width: 100%;
      }
      .in:focus {
        outline: 2px solid var(--y);
        border-color: var(--g);
      }
      textarea.in {
        resize: vertical;
      }
      label {
        font-weight: 700;
        font-size: 13px;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hero {
        background: var(--ly);
        border-radius: 14px;
        padding: 26px 28px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 3px solid var(--y);
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 10px 18px;
        border: 0;
        border-radius: 8px 8px 0 0;
        background: var(--lg);
        color: var(--dk);
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .tab.on {
        background: var(--y);
      }
      .sp {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 9px 0;
        border-bottom: 1px solid #e1ecdc;
      }
      .sp > * {
        flex: 1;
      }
      .sp > :last-child {
        text-align: right;
      }
      .pill {
        background: var(--lg);
        border-radius: 99px;
        padding: 3px 10px;
        font-size: 12px;
        display: inline-block;
        white-space: nowrap;
      }
      .pill.ok {
        background: #cfebd6;
      }
      .pill.dr {
        background: var(--ly);
      }
      .pill.off {
        background: #e4e4e4;
      }
      table.t {
        width: 100%;
        border-collapse: collapse;
      }
      .t th {
        text-align: left;
        font-size: 12px;
        color: var(--mu);
        text-transform: uppercase;
        padding: 10px 8px;
        border-bottom: 2px solid var(--bd);
      }
      .t td {
        padding: 10px 8px;
        border-bottom: 1px solid #e1ecdc;
        vertical-align: middle;
      }
      .t tr:hover td {
        background: #f7faf2;
      }
      .t td.act {
        white-space: nowrap;
        text-align: right;
      }
      .split {
        display: flex;
        min-height: 100vh;
      }
      .split > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 48px;
        gap: 20px;
      }
      .split .l {
        background: var(--lg);
      }
      .card420 {
        width: min(420px, 100%);
        gap: 16px;
      }
      .err {
        color: var(--er);
        font-size: 13px;
        min-height: 16px;
      }
      .side {
        width: 230px;
        background: var(--lg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 100vh;
        flex: none;
        position: sticky;
        top: 0;
        align-self: flex-start;
        height: 100vh;
        overflow: auto;
      }
      .side a {
        padding: 9px 12px;
        border-radius: 8px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .side a.on {
        background: var(--y);
        font-weight: 700;
      }
      .adm {
        display: flex;
      }
      .adm main {
        flex: 1;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }
      .kpi h1 {
        color: var(--g);
      }
      .hb {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hb span {
        width: 110px;
        font-size: 13px;
        color: var(--mu);
      }
      .hb i {
        display: block;
        height: 16px;
        background: var(--g);
        border-radius: 4px;
      }
      .cols {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 120px;
      }
      .cols i {
        width: 28px;
        border-radius: 4px;
        display: block;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(27, 58, 38, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 20px;
      }
      .md {
        background: #fff;
        border-radius: 14px;
        width: min(720px, 100%);
        max-height: 90vh;
        overflow: auto;
        border-top: 6px solid var(--y);
      }
      .mh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 22px;
        border-bottom: 1px solid var(--bd);
      }
      .mb {
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .x {
        border: 0;
        background: var(--lg);
        width: 34px;
        height: 34px;
        border-radius: 99px;
        font-size: 20px;
        cursor: pointer;
      }
      .gal {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .tile {
        border: 1.5px dashed var(--b2);
        background: #eef4e8;
        border-radius: 10px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--mu);
        font-size: 13px;
        padding: 10px;
        cursor: pointer;
      }
      .tile img {
        max-width: 100%;
        max-height: 150px;
        object-fit: contain;
      }
      .file {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 14px;
      }
      .file b {
        flex: 1;
        word-break: break-all;
      }
      .up {
        border: 1.5px dashed var(--b2);
        border-radius: 10px;
        padding: 14px;
        background: #f7faf2;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background: var(--dk);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 40;
        max-width: 90vw;
      }
      #toast.show {
        opacity: 1;
      }
      #demo {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 30;
      }
      #demo > button {
        background: var(--dk);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      #dm {
        display: none;
        position: absolute;
        right: 0;
        bottom: 48px;
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 8px;
        width: 260px;
        max-height: 70vh;
        overflow: auto;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      }
      #dm.open {
        display: block;
      }
      #dm a {
        display: block;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
      }
      #dm a:hover {
        background: var(--lg);
      }
      #dm h4 {
        margin: 8px 10px 4px;
        font-size: 11px;
        color: var(--mu);
        text-transform: uppercase;
      }
      @media (max-width: 900px) {
        .two,
        .g4,
        .g5,
        .grid2 {
          grid-template-columns: 1fr 1fr;
        }
        .two {
          grid-template-columns: 1fr;
        }
        .split {
          flex-direction: column;
        }
        .adm {
          flex-direction: column;
        }
        .side {
          height: auto;
          min-height: 0;
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          position: static;
        }
        .row {
          flex-wrap: wrap;
        }
        .nav {
          flex-wrap: wrap;
          padding: 12px 16px;
        }
        .wrap {
          padding: 20px 16px;
        }
        .adm main {
          padding: 20px 16px;
        }
      }
      .sg {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: #fff;
        border: 1px solid var(--bd);
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        z-index: 15;
        overflow: hidden;
      }
      .sg.open {
        display: block;
      }
      .sg a {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        text-decoration: none;
        font-weight: 400;
        border-bottom: 1px solid #e1ecdc;
      }
      .sg a:hover {
        background: var(--lg);
      }
      .av {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--y);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
      }
      .alert {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        background: #f7d4d1;
        border: 1px solid #e5a5a0;
        color: #7a1914;
        padding: 12px 16px;
        border-radius: 10px;
      }
      .hit {
        background: var(--ly);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal"></div>
    <div id="toast" role="status"></div>
    <div id="demo">
      <button data-act="dm" aria-haspopup="true">Screens ▾</button>
      <div id="dm"></div>
    </div>

                  name: 0,
                  category: 1,
                  subtitle: 2,
                  description: 3,
                  specs: 4,
                };
              if (H.includes("name")) {
                start = 1;
                ix = {};
                [
                  "name",
                  "category",
                  "subtitle",
                  "description",
                  "specs",
                ].forEach((k) => (ix[k] = H.indexOf(k)));
              }
              let ok = 0;
              const bad = [];
              rows.slice(start).forEach((c, n) => {
                const g = (k) => (ix[k] >= 0 ? (c[ix[k]] || "").trim() : ""),
                  name = g("name"),
                  cat = g("category"),
                  row = n + start + 1;
                if (!name) {
                  bad.push("Row " + row + ": name is missing");
                  return;
                }
                if (!cat) {
                  bad.push(
                    "Row " + row + " (" + name + "): category is missing",
                  );
                  return;
                }
                if (
                  state.products.some(
                    (p) => p.name.toLowerCase() === name.toLowerCase(),
                  )
                ) {
                  bad.push(
                    "Row " +
                      row +
                      " (" +
                      name +
                      "): a product with this name already exists",
                  );
                  return;
                }
                let cn = state.cats.find(
                  (x) => x.toLowerCase() === cat.toLowerCase(),
                );
                if (!cn) {
                  if (!mk) {
                    bad.push(
                      "Row " +
                        row +
                        " (" +
                        name +
                        "): category “" +
                        cat +
                        "” does not exist",
                    );
                    return;
                  }
                  state.cats.push(cat);
                  cn = cat;
                }
                const specs = g("specs")
                  .split("|")
                  .map((x) => x.split("="))
                  .filter((x) => x[0].trim())
                  .map((x) => [x[0].trim(), x.slice(1).join("=").trim()]);
                state.products.push({
                  id: "p" + uid(),
                  name,
                  cat: cn,
                  sub: g("subtitle") || cn,
                  img: null,
                  published: pb,
                  updated: today(),
                  desc: g("description"),
                  specs: specs.length ? specs : [["", ""]],
                  files: {
                    brochure: [],
                    kld: [],
                    sheet: [],
                    images: [],
                    videos: [],
                    media: [],
                  },
                  pitch: { opener: "", pts: ["", ""], ask: "" },
                  objections: [["", ""]],
                  bc: { comp: "", rows: [["", "", ""]], wins: [], watch: [] },
                });
                ok++;
              });
              log("Imported products", ok + " from CSV");
              render(true);
              modal(
                "Import result",
                `<p><b>${ok}</b> product${ok === 1 ? "" : "s"} imported${pb ? " and published" : " as drafts"}. <b>${bad.length}</b> row${bad.length === 1 ? "" : "s"} skipped.</p>${
                  bad.length
                    ? `<div class="box col" style="background:var(--ly)">${bad
                        .slice(0, 15)
                        .map((x) => `<span class="mut">${esc(x)}</span>`)
                        .join(
                          "",
                        )}${bad.length > 15 ? `<span class="mut">…and ${bad.length - 15} more</span>` : ""}</div>`
                    : ""
                }<div class="row"><button class="btn p" data-act="close">Done</button></div>`,
              );
            };
            r.readAsText(f);
            break;
          }
          case "chpw": {
            const a = V("#cp0"),
              b = V("#cp1"),
              c = V("#cp2"),
              er = $("#er");
            $("#ok").textContent = "";
            if (!a) {
              er.textContent = "Enter your current password.";
              return;
            }
            if (b.length < 10) {
              er.textContent =
                "Use at least 10 characters for the new password.";
              return;
            }
            if (b === a) {
              er.textContent =
                "Choose a password different from the current one.";
              return;
            }
            if (b !== c) {
              er.textContent = "The two new passwords do not match.";
              return;
            }
            er.textContent = "";
            ["#cp0", "#cp1", "#cp2"].forEach((x) => ($(x).value = ""));
            $("#ok").textContent =
              "Password updated. Use the new password next time you sign in.";
            toast("Password updated");
            break;
          }
          case "dismissflash":
            state.flash = null;
            render(true);
            break;
          case "failnext":
            e.preventDefault();
            state.failNext = true;
            $("#dm").classList.remove("open");
            toast("The next upload will fail (demo of the error message)");
            break;
          case "retry":
            history.back();
            break;
          case "dl":
            if (d.u) window.open(d.u, "_blank", "noopener");
            else toast("Demo only: the real file will open or download here");
            break;
          case "close":
            closeM();
            break;
          case "demo":
            toast("Demo only: the real file will open or download here");
            break;
          case "dm":
            $("#dm").classList.toggle("open");
            break;
          case "tab":
            collect(ed.p, ed.tab);
            break;
          case "preview":
            collect(ed.p, ed.tab);
            break;
          case "addprod": {
            const p = {
              id: "p" + uid(),
              name: "",
              cat: "",
              sub: "",
              img: null,
              published: false,
              updated: today(),
              desc: "",
              specs: [["", ""]],
              files: {
                brochure: [],
                kld: [],
                sheet: [],
                images: [],
                videos: [],
                media: [],
              },
              pitch: { opener: "", pts: ["", ""], ask: "" },
              objections: [["", ""]],
              bc: { comp: "", rows: [["", "", ""]], wins: [], watch: [] },
            };
            state.products.push(p);
            go("/admin/products/" + p.id + "/details");
            break;
          }
          case "savep":
          case "publish": {
            collect(ed.p, ed.tab);
            const p = ed.p || prod(d.id);
            if (act === "publish" || p.published) {
              if (!p.name || !p.cat) {
                toast("Enter a name and category first (Details tab)");
                break;
              }
              p.published = true;
            }
            p.updated = today();
            log(
              act === "publish" ? "Published" : "Saved",
              p.name || "(Untitled)",
            );
            render(true);
            toast(
              act === "publish"
                ? "Published. Reps can now see this product"
                : "Saved",
            );
            break;
          }
          case "pubrow": {
            const p = need();
            if (!p.name || !p.cat) {
              toast("Open the product and add a name and category first");
              break;
            }
            p.published = true;
            p.updated = today();
            log("Published", p.name);
            render(true);
            toast("Published");
            break;
          }
          case "unpub": {
            const p = need();
            p.published = false;
            log("Unpublished", p.name);
            render(true);
            toast("Unpublished. Reps no longer see it");
            break;
          }
          case "addspec":
            collect(ed.p, ed.tab);
            ed.p.specs.push(["", ""]);
            render(true);
            break;
          case "delspec":
            collect(ed.p, ed.tab);
            ed.p.specs.splice(+d.i, 1);
            render(true);
            break;
          case "addobj":
            collect(ed.p, ed.tab);
            ed.p.objections.push(["", ""]);
            render(true);
            break;
          case "delobj":
            collect(ed.p, ed.tab);
            ed.p.objections.splice(+d.i, 1);
            render(true);
            break;
          case "addbc":
            collect(ed.p, ed.tab);
            ed.p.bc.rows.push(["", "", ""]);
            render(true);
            break;
          case "delbc":
            collect(ed.p, ed.tab);
            ed.p.bc.rows.splice(+d.i, 1);
            render(true);
            break;
          case "upmodal":
            upModal();
            break;
          case "saveup": {
            const p = prod(V("#up")),
              fs = $("#uf").files;
            if (!fs.length) {
              $("#er").textContent = "Choose at least one file.";
              return;
            }
            if (state.failNext) {
              state.failNext = false;
              $("#er").textContent =
                "Upload failed. Check your connection and try again. Nothing was changed.";
              return;
            }
            addFiles(p, V("#uy"), fs);
            state.flash = null;
            closeM();
            render(true);
            toast("Uploaded");
            break;
          }
          case "addcatm":
            modal(
              "Add category",
              `<div class="fld"><label for="nc">Category name</label><input id="nc" class="in" placeholder="e.g. Ice Cream Freezer"></div><div class="err" id="er"></div><div class="row"><button class="btn p" data-act="savenewcat">Add category</button><button class="btn" data-act="close">Cancel</button></div>`,
            );
            setTimeout(() => {
              const e = $("#nc");
              if (e) e.focus();
            }, 50);
            break;
          case "savenewcat": {
            const n = V("#nc").trim();
            if (!n) {
              $("#er").textContent = "Enter a category name.";
              return;
            }
            if (state.cats.some((c) => c.toLowerCase() === n.toLowerCase())) {
              $("#er").textContent = "That category already exists.";
              return;
            }
            state.cats.push(n);
            log("Added category", n);
            closeM();
            render(true);
            toast("Category added");
            break;
          }
          case "rencat": {
            const c = state.cats[+d.i];
            modal(
              "Rename category",
              `<div class="fld"><label for="rn">Name</label><input id="rn" class="in" value="${esc(c)}"></div><div class="row"><button class="btn p" data-act="savecat" data-i="${d.i}">Save</button><button class="btn" data-act="close">Cancel</button></div>`,
            );
            break;
          }
          case "savecat": {
            const i = +d.i,
              o = state.cats[i],
              n = V("#rn").trim();
            if (!n) break;
            state.products.forEach((p) => {
              if (p.cat === o) p.cat = n;
            });
            state.cats[i] = n;
            log("Renamed category", o + " → " + n);
            closeM();
            render(true);
            break;
          }
          case "delcat": {
            const c = state.cats.splice(+d.i, 1)[0];
            log("Deleted category", c);
            render(true);
            break;
          }
          case "usermodal":
            userModal();
            break;
          case "saveuser": {
            const n = V("#un").trim(),
              m = V("#ue").trim();
            if (!n || !m.includes("@")) {
              $("#er").textContent = "Enter a name and a valid email.";
              return;
            }
            state.users.push({
              id: "u" + uid(),
              name: n,
              email: m.toLowerCase(),
              role: V("#ur"),
              region: V("#ug") || "–",
              team: V("#ut") || "–",
              active: true,
            });
            log("Added user", m);
            closeM();
            render(true);
            toast("User added. A password email would be sent");
            break;
          }
          case "impmodal":
            impModal();
            break;
          case "doimp": {
            const f = $("#imp").files[0];
            if (!f) {
              $("#er").textContent = "Choose a CSV file.";
              return;
            }
            const r = new FileReader();
            r.onload = () => {
              let n = 0;
              r.result.split(/\r?\n/).forEach((l, i) => {
                const c = l.split(",").map((x) => x.trim());
                if (!c[1] || !c[1].includes("@")) return;
                state.users.push({
                  id: "u" + uid(),
                  name: c[0] || c[1],
                  email: c[1].toLowerCase(),
                  role: /admin/i.test(c[2]) ? "Admin" : "Rep",
                  region: c[3] || "–",
                  team: c[4] || "–",
                  active: true,
                });
                n++;
              });
              log("Imported users", n + " from CSV");
              closeM();
              render(true);
              toast(n + " user" + (n === 1 ? "" : "s") + " imported");
            };
            r.readAsText(f);
            break;
          }
          case "deact": {
            const u = state.users.find((x) => x.id === d.id);
            u.active = !u.active;
            log(u.active ? "Activated user" : "Deactivated user", u.email);
            render(true);
            break;
          }
          case "resetpw": {
            const u = state.users.find((x) => x.id === d.id);
            log("Reset password", u.email);
            toast("Reset link sent to " + u.email + " (demo)");
            break;
          }
          case "export":
            toast("Export started (demo)");
            break;
          case "saveset":
            log("Saved settings", "Password policy");
            toast("Settings saved (demo)");
            break;
        }
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset && t.dataset.up) {
          const p = curEd().p;
          if (!t.files.length) return;
          if (state.failNext) {
            state.failNext = false;
            state.flash =
              "Upload failed for " +
              [...t.files].map((x) => x.name).join(", ") +
              ". Check your connection and try again. Nothing was changed.";
            render(true);
            return;
          }
          state.flash = null;
          addFiles(p, t.dataset.up, t.files);
          render(true);
          toast("Uploaded");
          return;
        }
        if (t.dataset && t.dataset.nv) {
          const [pid, tp, i] = t.dataset.nv.split("|"),
            p = prod(pid),
            f = p.files[tp][+i],
            nf = t.files[0];
          if (!nf) return;
          if (state.failNext) {
            state.failNext = false;
            state.flash =
              "Upload failed for " +
              nf.name +
              ". Check your connection and try again. The current version was not changed.";
            render(true);
            return;
          }
          f.prev.unshift({ n: f.n, v: f.v, added: f.added, url: f.url });
          f.n = nf.name;
          f.v += 1;
          f.added = Date.now();
          f.url = URL.createObjectURL(nf);
          p.updated = today();
          state.flash = null;
          log("Uploaded new version", nf.name + " (v" + f.v + ")");
          render(true);
          toast("New version uploaded: v" + f.v);
          return;
        }
        if (t.id === "pst" || t.id === "pct") filterProducts();
        if (t.id === "fp" || t.id === "ft") filterFiles();
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "pq") filterProducts();
        if (e.target.id === "gs") {
          if (route.a === "search") liveSearch(e.target.value);
          else suggest(e.target.value);
        }
      });
      function filterProducts() {
        const q = (V("#pq") || "").toLowerCase(),
          s = V("#pst"),
          c = V("#pct");
        $$("tbody tr[data-n]").forEach((r) => {
          r.style.display =
            (!q || r.dataset.n.includes(q)) &&
            (s === "All statuses" || r.dataset.s === s) &&
            (c === "All categories" || r.dataset.c === c)
              ? ""
              : "none";
        });
      }
      function filterFiles() {
        const p = V("#fp"),
          t = V("#ft");
        $$("tbody tr[data-p]").forEach((r) => {
          r.style.display =
            (p === "All products" || r.dataset.p === p) &&
            (t === "All types" || r.dataset.t === t)
              ? ""
              : "none";
        });
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeM();
      });
      const MENU = [
        [
          "Sign in",
          [
            ["Login", "/login"],
            ["Forgot password", "/forgot"],
            ["Session expired", "/session-expired"],
            ["Error page", "/error"],
          ],
        ],
        [
          "Rep",
          [
            ["Home", "/home"],
            ["Search results", "/search?q=visi"],
            ["Product: SRC1800-GL", "/product/src1800/pitch"],
            ["Battlecard: SRC1800-GL", "/product/src1800/battlecard"],
            ["Product: F550GL23", "/product/f550/pitch"],
            ["Battlecard: F550GL23", "/product/f550/battlecard"],
            ["Account (change password)", "/account"],
          ],
        ],
        [
          "Admin",
          [
            ["Dashboard", "/admin"],
            ["Products", "/admin/products"],
            ["Product editor: details", "/admin/products/src1800/details"],
            ["Product editor: files", "/admin/products/src1800/files"],
            ["Product editor: sales pitch", "/admin/products/src1800/pitch"],
            [
              "Product editor: battlecard",
              "/admin/products/src1800/battlecard",
            ],
            ["Categories", "/admin/categories"],
            ["Files", "/admin/files"],
            ["Users", "/admin/users"],
            ["Reports", "/admin/reports"],
            ["Activity log", "/admin/audit"],
            ["Settings", "/admin/settings"],
            ["My account", "/account"],
          ],
        ],
      ];
      $("#dm").innerHTML =
        MENU.map(
          (g) =>
            `<h4>${g[0]}</h4>` +
            g[1].map((i) => `<a href="#${i[1]}">${i[0]}</a>`).join(""),
        ).join("") +
        '<h4>Demo</h4><a href="#" data-act="failnext">Make the next upload fail</a>';
      window.addEventListener("hashchange", () => {
        $("#dm").classList.remove("open");
        closeM();
        render(false);
      });
      window.addEventListener("offline", () =>
        toast("You are offline. Changes cannot be saved until you reconnect."),
      );
      window.addEventListener("online", () => toast("Back online"));
      render(false);
    </script>
  </body>
</html>
