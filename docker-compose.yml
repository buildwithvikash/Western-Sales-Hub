# Runs PostgreSQL and the Sales Hub together.
#   1. Create a file named .env next to this one with at least:
#        POSTGRES_PASSWORD=<a strong password>
#        JWT_SECRET=<long random string>
#        APP_URL=https://saleshub.yourcompany.com
#      plus the MAIL_* / SMTP_* settings from server/.env.example.
#   2. docker compose up -d
#   3. First time only, load the sample data and accounts:
#        docker compose exec app node scripts/init-db.js
#   Put HTTPS in front (IIS, nginx, Caddy, a cloud load balancer) and keep TRUST_PROXY as set below.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_hub
      POSTGRES_USER: saleshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleshub -d sales_hub"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://saleshub:${POSTGRES_PASSWORD}@db:5432/sales_hub
      NODE_ENV: production
      TRUST_PROXY: "1"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:
